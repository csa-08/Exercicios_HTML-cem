<body>
    <h1>Tags &lt;&gt;</h1>
    <b>&lt;br&gt;: </b> Passa para a próxima linha <br>
    <b>&lt;h1&gt;:</b> Adiciona um título <br>
    <b>&lt;p&gt;: </b>Adiciona um parágrafo <br>
    <b>&lt;img&gt;:</b> Adiciona uma imagem <br>
    
    <h1>Caracteres especiais</h1>
    <h3>sempre com ;</h3>
    <p>&uparrow;: &uparrow</p>
    <p>&darr;: &darr</p>
    <p>&larr;: &larr</p>
    <p>&rarr;: &rarr</p>
    <b>moedas:</b> &nome da moeda em inglês <br>
    <b>emojis:</b> &#x(código do emiji da emojipedia) 

    
</body>
